openapi: 3.0.0
info:
  title: IAM Security Telemetry Processing & Stats Service
  version: 1.0.0
  description: Provides aggregate security telemetry statistics computed from storage events.

paths:
  /stats:
    get:
      summary: Get aggregate security telemetry statistics
      operationId: app.get_stats
      description: Returns cumulative event counts and metrics stored in Redis.
      responses:
        '200':
          description: Aggregate statistics successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStats'
        '503':
          description: Statistics service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatsDown'


components:
  schemas:
    ProcessingStatsDown:
      type: object
      properties:
        error:
          type: string
    ProcessingStats:
      type: object
      required:
        - total_login_events
        - total_access_checks
        - max_failed_attempts
        - max_privilege_level
        - last_updated
      properties:
        total_login_events:
          type: integer
          description: Cumulative count of login events processed
          example: 120
        total_access_checks:
          type: integer
          description: Cumulative count of access checks processed
          example: 350
        max_failed_attempts:
          type: integer
          description: Maximum failed attempts recorded across all logins
          example: 5
        max_privilege_level:
          type: integer
          description: Maximum privilege level requested across access checks
          example: 3
        latest_login_timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent login event processed from storage
          example: "2026-10-28T00:30:00.123456Z"
        latest_access_check_timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent access check event processed from storage
          example: "2026-10-28T00:30:00.123456Z"
        last_login_id:
          type: integer
          description: Database ID of the latest login event processed
          example: 42
        last_access_check_id:
          type: integer
          description: Database ID of the latest access check event processed
          example: 35
        last_updated:
          type: string
          format: date-time
          description: Timestamp when the statistics were last calculated and saved to Redis
          example: "2026-10-28T00:30:05.654321Z"
