services:
  db:
    image: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: skibidi
      MYSQL_PASSWORD: helpme
      MYSQL_DATABASE: events
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "-u",
          "skibidi",
          "-phelpme",
          "ping",
          "-h",
          "localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    build:
      context: storage
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=mysql://skibidi:helpme@db:3306/events
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://storage:8090/status"]
      interval: 5s
      timeout: 1s
      retries: 5

  storage-worker:
    build:
      context: storage
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=mysql://skibidi:helpme@db:3306/events
      - KAFKA_BROKER=redpanda:9092
      - KAFKA_TOPIC_LOGIN=login
      - KAFKA_TOPIC_ACCESS=accessChecks
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  receiver:
    build:
      context: receiver
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=redpanda:9092
      - KAFKA_TOPIC_LOGIN=login
      - KAFKA_TOPIC_ACCESS=accessChecks
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 1s
      retries: 5
    ports:
      - 8080:8080

  redis:
    image: redis:alpine
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  processing-worker:
    build:
      context: processing
      dockerfile: Dockerfile.worker
    environment:
      - STORAGE_SERVICE_URL=http://storage:8090
      - REDIS_URL=redis://redis:6379
      - POLL_INTERVAL=5
    depends_on:
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy

  processing:
    build:
      context: processing
      dockerfile: Dockerfile.service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://processing:8100/stats"]
      interval: 5s
      timeout: 2s
      retries: 5
    ports:
      - 8100:8100
  
  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100

  alloy:
    image: grafana/alloy:latest
    ports:
      - 12345:12345
    volumes:
      - ./prometheus/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - 3000:3000
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - grafana-storage:/var/lib/grafana

  redpanda:
    command:
      - redpanda
      - start

      # LISTENERS: which ports the broker opens inside the container.
      # Nothing is told to clients here; this only opens the doors.
      #   internal = for other containers on the Docker network
      #   external = for tools running on the host machine (my laptop)
      # 0.0.0.0 = accept connections on all interfaces in the container.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092

      # ADVERTISED ADDRESSES: the address the broker tells clients to
      # reconnect to. Clients ignore what they originally typed and
      # use THIS, so it must work from where the client is standing.
      # The listener name (internal/external) links each address to
      # the listener above that it belongs to.
      #   internal -> "redpanda" is the Docker service name; it only
      #               resolves inside the Docker network.
      #   external -> "localhost" is correct from the host machine,
      #               via the published port below.
      # Using one address for both breaks one side: "redpanda" doesn't
      # exist on the host, and "localhost" inside a container points
      # at that container, not Redpanda.
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092

      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082

      # Address the broker advertises to clijent that connect to the HTTP proxy
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082

      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081

      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145

      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container

      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
      - --set redpanda.auto_create_topics_enabled=true
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    volumes:
      - redpanda:/var/lib/redpanda/data
    ports:
      - 19092:19092
      - 18082:18082
      - 18081:18081
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redpanda-console:
    # the console is for inspecting and debugging the services using redpanda
    image: docker.redpanda.com/redpandadata/console:v3.7.4
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      # for accessing the console outside the docker network
      - 8085:8080
    depends_on:
      - redpanda

volumes:
  redis_data:
  redpanda:
  grafana-storage:
