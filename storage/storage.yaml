openapi: 3.0.0
info:
  title: IAM Security Telemetry Receiver
  version: 1.0.0

paths:
  /auth/login:
    get:
      summary: Get all login attempts after a given timestamp
      operationId: storage.get_login_events
      description: Returns a list of login events after the specified timestamp.
      parameters:
        - in: query
          name: after
          schema:
            type: string
            format: date-time
          description: Return login events after this timestamp
        - in: query
          name: last_id
          schema:
            type: integer
            default: 0
          description: Return events with ID greater than this if recorded_timestamp matches after
      responses:
        '200':
          description: A list of login events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginEvent'

  /auth/access-check:
    get:
      summary: get access checks after a timestamp
      operationId: storage.get_access_checks
      description: Returns a list of access check events recorded after the specified timestamp
      parameters:
        - in: query
          name: after
          schema:
            type: string
            format: date-time
          description: Return only access check events recorded after this timestamp
        - in: query
          name: last_id
          schema:
            type: integer
            default: 0
          description: Return events with ID greater than this if recorded_timestamp matches after
      responses:
        '200':
          description: A list of access check events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessCheck'

  /status:
    get:
      summary: Service health check and event record counts
      operationId: storage.get_status
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusCheck'
  /reset:
    post:
      summary: Reset the database by dropping and recreating tables
      operationId: storage.reset_database
      responses:
        '200':
          description: Database reset successfully

components:
  schemas:
    LoginEvent:
      type: object
      required:
        - user_id
        - failed_attempts
        - timestamp
        - trace_id
      properties:
        id:
          type: integer
          description: Unique database record identifier
          example: 1
        user_id:
          type: string
          format: uuid
          description: User identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        failed_attempts:
          type: integer
          description: Metric for statistics (e.g., failed attempts before login)
          example: 3
        timestamp:
          type: string
          format: date-time
          description: Event recording time (ISO 8601)
          example: "2026-09-22T10:33:36Z"
        ip_address:
          type: string
          description: Client IP address
          example: "192.168.1.105"
        status:
          type: string
          description: SUCCESS or FAILURE
          enum: ["SUCCESS", "FAILURE"]
          example: "FAILURE"
        trace_id:
          type: string
          description: "for tracking events"
          example: "1728169999000000000"
        recorded_timestamp:
          type: string
          format: date-time
          description: Timestamp when the even was recorded in the database
          example: "2026-10-24T21:40:00.123456Z"

    AccessCheck:
      type: object
      required:
        - user_id
        - privilege_level
        - timestamp
        - resource_path
        - access_granted
        - trace_id
      properties:
        id:
          type: integer
          description: Unique database record identifier
          example: 1
        user_id:
          type: string
          format: uuid
          description: User identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        privilege_level:
          type: integer
          description: Metric for statistics (1 = User, 2 = Manager, 3 = Admin)
          example: 2
        timestamp:
          type: string
          format: date-time
          description: Event recording time (ISO 8601)
          example: "2026-09-22T10:33:36Z"
        resource_path:
          type: string
          description: Target endpoint (e.g., /admin/finance)
          example: "/admin/finance"
          pattern: "^/[a-zA-Z0-9/_-]+$"       # Restricts the pattern to a file path
          minLength: 2
          maxLength: 100
        access_granted:
          type: boolean
          description: true or false
          example: false
        trace_id:
          type: string
          description: "for tracking events"
          example: "1728169999000000000"
        recorded_timestamp:
          type: string
          format: date-time
          description: Timestamp when the even was recorded in the database
          example: "2026-10-24T21:40:00.123456Z"

    statusCheck:
      type: object
      properties:
        num_logins:
          type: integer
          example: 50
        num_access_checks:
          type: integer
          example: 50
